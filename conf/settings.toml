[project]
name = "CANON"
version = "0.1.0"
discipline = "Political Science / International Relations"
contact_email = "replace-me@example.com"

[paths]
data_dir = "data"
raw_dir = "data/raw"
processed_dir = "data/processed"
reports_dir = "reports"
fixtures_dir = "data/fixtures"

[openalex]
base_url = "https://api.openalex.org"
topic_file = "conf/topics/political_science_ir.toml"
from_publication_year = 2010
to_publication_year = 2026
language = "en"
per_page = 100
max_results = 500
api_key_env = "OPENALEX_API_KEY"

[ingest]
chunk_tokens = 420
chunk_overlap_tokens = 70
min_abstract_chars = 120

[importance_weights.default]
relevance = 1.0
semantic_similarity = 0.5
source_quality = 0.4
citation_centrality = 0.3
author_score = 0.15
section_role = 0.2
claim_density = 0.2
diversity = 0.2
recency = 0.1

[retrieval]
default_policy = "balanced"
top_k = 5
preview_chars = 280

[retrieval.policies.lexical]
