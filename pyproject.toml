[project]
name = "canon-rag"
version = "0.1.0"
description = "Human-governed evidence packet and intelligence briefing workbench"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []
keywords = [
  "rag",
  "retrieval",
  "evidence",
  "human-review",
  "intelligence-analysis",
  "evaluation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/Saltef/CANON"
Repository = "https://github.com/Saltef/CANON"
Documentation = "https://github.com/Saltef/CANON#readme"
Issues = "https://github.com/Saltef/CANON/issues"

[project.optional-dependencies]
docs = [
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
]
models = [
  "cohere>=5.0",
  "openai>=1.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
canon-acceptance-scenario = "canon.product.acceptance_scenario:main"
canon-api = "canon.product.server:main"
canon-alert-digest = "canon.intelligence.alerts:main"
canon-alert-eval = "canon.eval.alert_digest:main"
canon-demo = "canon.product.demo:main"
canon-flagship-handoff = "canon.product.flagship_handoff:main"
canon-frame-coverage = "canon.product.frame_coverage:main"
canon-ingest = "canon.ingest.flexible:main"
canon-intelligence-brief = "canon.intelligence.evidence_runner:main"
canon-intelligence-eval = "canon.eval.intelligence_brief:main"
canon-intelligence-review = "canon.product.intelligence_review:main"
canon-mounted-corpus = "canon.product.mounted_corpus:main"
canon-prehuman-check = "canon.product.prehuman_check:main"
canon-product-final-check = "canon.product.final_check:main"
canon-project = "canon.product.project:main"
canon-readiness = "canon.product.readiness:main"
canon-release-audit = "canon.product.release_audit:main"
canon-report-quality = "canon.product.report_quality:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["canon*"]

[tool.setuptools.package-data]
canon = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
