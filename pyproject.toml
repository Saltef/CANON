[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-rag"
version = "0.1.0"
description = "Importance-aware scholarly RAG ingestion and evaluation workbench"
requires-python = ">=3.12"
dependencies = []
readme = "README.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["canon*"]

[tool.setuptools.package-data]
canon = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
