services:
  canon:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CANON_SETTINGS: /app/conf/settings.toml
      CANON_DATA_DIR: /app/data
      CANON_REPORTS_DIR: /app/reports
      CANON_VECTORSTORE: qdrant
      CANON_ALLOWED_ORIGINS: ${CANON_ALLOWED_ORIGINS:-http://localhost:8000}
      CANON_REQUIRE_AUTH: ${CANON_REQUIRE_AUTH:-false}
      CANON_API_KEY: ${CANON_API_KEY:-}
      CANON_BASIC_AUTH_USER: ${CANON_BASIC_AUTH_USER:-}
      CANON_BASIC_AUTH_PASSWORD: ${CANON_BASIC_AUTH_PASSWORD:-}
      CANON_MAX_CONCURRENCY: ${CANON_MAX_CONCURRENCY:-8}
      CANON_MAX_QUEUE_DEPTH: ${CANON_MAX_QUEUE_DEPTH:-16}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./conf:/app/conf:ro
      - ./gold:/app/gold:ro

  canon-render-smoke:
    profiles: ["render-smoke"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CANON_SETTINGS: /app/conf/settings.toml
      CANON_DATA_DIR: /app/data
      CANON_REPORTS_DIR: /app/reports
      CANON_VECTORSTORE: qdrant
      CANON_ALLOWED_ORIGINS: ""
      CANON_REQUIRE_AUTH: "false"
      CANON_MAX_CONCURRENCY: 8
      CANON_MAX_QUEUE_DEPTH: 16
      OPENROUTER_API_KEY: ""
      COHERE_API_KEY: ""
      QDRANT_URL: ""
      QDRANT_API_KEY: ""
      OPENALEX_API_KEY: ""
      PORT: 8000
    ports:
      - "8001:8000"
